      function escapeHtml(text) {
        if (!text) return '';
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, function(m) { return map[m]; });
      }

      function formatearDNI(dni) {
        const num = dni.replace(/\D/g, '');
        if (num.length <= 2) return num;
        if (num.length <= 5) return num.replace(/(\d{2})(\d{1,3})/, '$1.$2');
        if (num.length <= 8) return num.replace(/(\d{2})(\d{3})(\d{1,3})/, '$1.$2.$3');
        return num.replace(/(\d{2})(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3.$4');
      }

      function normalizarDNI(dni) {
        return dni.replace(/\D/g, '');

        toast.innerHTML = `

            `;
        toast.querySelector('.toast-close').addEventListener('click', function() { toast.remove(); });

        setTimeout(() => { if (toast.parentNode) toast.remove(); }, 5000);

      // Obtener todos los vigilantes de Firestore
      async function obtenerVigilantes() {
        const snapshot = await db.collection('vigilantes').orderBy('datosPersonales.apellido').get();
        const vigilantes = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          data.id = doc.id;
          vigilantes.push(data);
        });
        return vigilantes;
      }

      // Agregar un nuevo vigilante
      async function agregarVigilante(vigilante) {
        const docRef = await db.collection('vigilantes').add(vigilante);
        return docRef.id;
      }

      // Actualizar un vigilante existente
      async function actualizarVigilante(vigilante) {
        const id = vigilante.id;
        delete vigilante.id;
        await db.collection('vigilantes').doc(id).update(vigilante);
        vigilante.id = id;
      }

      // Eliminar un vigilante
      async function eliminarVigilante(id) {
        await db.collection('vigilantes').doc(id).delete();
      }

      // Buscar por DNI (único)
      async function buscarPorDNI(dni) {
        const snapshot = await db.collection('vigilantes').where('datosPersonales.dni', '==', dni).get();
        if (!snapshot.empty) {
          const doc = snapshot.docs[0];
          const data = doc.data();
          data.id = doc.id;
          return data;
        }
        return null;
      }

      // ---------- FILTROS ----------
      function aplicarFiltros() {
        const texto = buscadorInput.value.trim().toLowerCase();
        const filtroNombre = (vig) => {
          if (!texto) return true;
          const nombreCompleto = (vig.datosPersonales.nombre + ' ' + vig.datosPersonales.apellido + ' ' + vig
            .datosPersonales.dni).toLowerCase();
          return nombreCompleto.includes(texto);
        };

        const filtroHab = (vig) => {
          const hab = vig.habilitaciones || {};
          if (filtroTipoHab.value && hab.tipo !== filtroTipoHab.value) return false;
          if (filtroNumHab.value && !hab.numero?.toLowerCase().includes(filtroNumHab.value.toLowerCase()))
            return false;
          if (filtroOrganismo.value && !hab.organismo?.toLowerCase().includes(filtroOrganismo.value
              .toLowerCase())) return false;
          if (filtroVencDesde.value && hab.fechaVenc && hab.fechaVenc < filtroVencDesde.value) return false;
          if (filtroVencHasta.value && hab.fechaVenc && hab.fechaVenc > filtroVencHasta.value) return false;
          return true;
        };

        const filtroLab = (vig) => {
          const lab = vig.datosLaborales || {};
          if (filtroCategoria.value && lab.categoria !== filtroCategoria.value) return false;
          if (filtroObraSocial.value && !lab.obraSocial?.toLowerCase().includes(filtroObraSocial.value
              .toLowerCase())) return false;
          if (filtroSindicato.value && !lab.sindicato?.toLowerCase().includes(filtroSindicato.value
              .toLowerCase())) return false;
          if (filtroBanco.value && !lab.banco?.toLowerCase().includes(filtroBanco.value.toLowerCase()))
            return false;
          if (filtroCUIL.value && !lab.cuil?.toLowerCase().includes(filtroCUIL.value.toLowerCase()))
            return false;
          return true;
        };

        const filtroRopa = (vig) => {
          const ropa = vig.ropa || {};
          if (filtroTallaCamisa.value && ropa.tallaCamisa?.toLowerCase() !== filtroTallaCamisa.value
              .toLowerCase()) return false;
          if (filtroTallaPantalon.value && ropa.tallaPantalon?.toLowerCase() !== filtroTallaPantalon.value
              .toLowerCase()) return false;
          if (filtroTallaCalzado.value && ropa.tallaCalzado?.toLowerCase() !== filtroTallaCalzado.value
              .toLowerCase()) return false;
          const entregas = ropa.entregas || [];
          if (filtroTipoPrenda.value) {
            const tipo = filtroTipoPrenda.value.toLowerCase();
            if (!entregas.some(e => e.tipo.toLowerCase().includes(tipo))) return false;
          }
          if (filtroEntregaDesde.value || filtroEntregaHasta.value) {
            const desde = filtroEntregaDesde.value;
            const hasta = filtroEntregaHasta.value;
            const tieneEntrega = entregas.some(e => {
              if (desde && e.fecha < desde) return false;
              if (hasta && e.fecha > hasta) return false;
              return true;
            });
            if (!tieneEntrega) return false;
          }
          return true;
        };

        const filtroRRHH = (vig) => {
          const rrhh = vig.rrhh || {};
          if (filtroObservaciones.value && !rrhh.observaciones?.toLowerCase().includes(filtroObservaciones
              .value.toLowerCase())) return false;
          if (filtroEvaluaciones.value) {
            const evalText = (rrhh.evaluaciones || []).map(e => e.nota).join(' ').toLowerCase();
            if (!evalText.includes(filtroEvaluaciones.value.toLowerCase())) return false;
          }
          return true;
        };

        const filtrados = todosLosVigilantes.filter(vig => {
          return filtroNombre(vig) && filtroHab(vig) && filtroLab(vig) && filtroRopa(vig) && filtroRRHH(vig);
        });

        renderLista(filtrados);
      }

          const foto = vig.datosPersonales.foto || '';

        const nombre = inputNombre.value.trim();

        const dni = normalizarDNI(inputDNI.value);
        if (!nombre || !apellido || !dni) {
          mostrarToast('Nombre, Apellido y DNI (solo números) son obligatorios.', 'error');
          return false;
        }
        if (!/^\d{7,8}$/.test(dni)) {
          mostrarToast('DNI debe tener 7 u 8 dígitos (sin puntos).', 'error');
          return false;
        }
        const email = inputEmail.value.trim();
        if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          mostrarToast('Email inválido.', 'error');
          return false;
        }
        const fechaNac = inputFechaNac.value;
        if (fechaNac) {
          const hoy = new Date();
          const nac = new Date(fechaNac);
          if (nac > hoy) {
            mostrarToast('La fecha de nacimiento no puede ser futura.', 'error');
            return false;
          }
        }
        return true;
      }

        if (!validarFormulario()) return;
        const datos = recolectarDatosFormulario();
        const dni = datos.datosPersonales.dni;
        try {
          const existente = await buscarPorDNI(dni);
          if (existente && existente.id !== vigilanteEditandoId) {
            mostrarToast('Ya existe un vigilador con ese DNI.', 'error');
            return;
          }
        } catch (err) {
          mostrarToast('Error al verificar DNI: ' + err.message, 'error');
          return;
        }

        setGuardando(true);
        mostrarSpinnerGlobal(true);
        try {
          if (vigilanteEditandoId === null) {
            await agregarVigilante(datos);
            mostrarToast('Vigilador agregado correctamente.', 'exito');
          } else {
            const vigActualizado = { id: vigilanteEditandoId, ...datos };
            await actualizarVigilante(vigActualizado);
            mostrarToast('Vigilador actualizado correctamente.', 'exito');
          }
          cerrarModal();
          await cargarDatos();
        } catch (err) {
          console.error('Error al guardar:', err);
          mostrarToast('Error al guardar: ' + err.message, 'error');
        } finally {
          setGuardando(false);
          mostrarSpinnerGlobal(false);
        }
      }

      function formatearFecha(valor) {
        if (!valor) return '';
        if (typeof valor === 'number') {
          const fecha = new Date((valor - 25569) * 86400 * 1000);
          return fecha.toISOString().split('T')[0];
        }
        const str = String(valor).trim();
        if (!str) return '';
        const parts = str.split(/[\/\- ]/);
        if (parts.length === 3) {
          if (parts[0].length === 4) return `${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;
          else return `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
        }
        return str;
      }

      function procesarArchivoAltas(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            let sheetName = workbook.SheetNames.find(name => name.trim().toUpperCase() === 'ALTAS');
            if (!sheetName) sheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            const range = XLSX.utils.decode_range(worksheet['!ref']);
            const allRows = [];
            for (let r = range.s.r; r <= range.e.r; r++) {
              const row = [];
              for (let c = range.s.c; c <= range.e.c; c++) {
                const addr = XLSX.utils.encode_cell({ r, c });
                const cell = worksheet[addr];
                row.push(cell ? String(cell.v).trim() : '');
              }
              allRows.push(row);
            }

            // Detectar encabezados
            let headerRowIndex = -1;
            let maxScore = 0;
            const keywords = ['legajo', 'nombre', 'dni', 'apellido', 'cuil', 'fecha', 'alta', 'domicilio'];
            for (let i = 0; i < allRows.length; i++) {
              const rowText = allRows[i].join(' ').toLowerCase();
              let score = 0;
              for (const kw of keywords) {
                if (rowText.includes(kw)) score++;
              }
              if (rowText.includes('dni') && rowText.includes('nombre')) score += 3;
              if (rowText.includes('legajo')) score += 2;
              if (score > maxScore) { maxScore = score;
                headerRowIndex = i; }
            }
            if (headerRowIndex === -1 || maxScore < 3) {
              mostrarToast('No se pudo identificar la fila de encabezados.', 'error');
              return;
            }

            const headers = allRows[headerRowIndex];
            console.log('Encabezados detectados:', headers);

            function findCol(keywords) {
              for (let i = 0; i < headers.length; i++) {
                const h = headers[i].toLowerCase().trim();
                for (const kw of keywords) {
                  if (h.includes(kw.toLowerCase())) return i;
                }
              }
              return -1;
            }
            const colMap = {
              legajo: findCol(['legajo', 'nº legajo', 'n° legajo']),
              nombreCompleto: findCol(['nombre y apellido', 'nombre completo', 'apellido y nombre']),
              dni: findCol(['dni']),
              cuil: findCol(['cuil']),
              fechaNac: findCol(['f.nacimiento', 'fecha nacimiento', 'nacimiento']),
              fechaIngreso: findCol(['fecha alta', 'alta']),
              nombreMadre: findCol(['n. madre', 'madre']),
              nombrePadre: findCol(['n. padre', 'padre']),
              domicilio: findCol(['domicilio', 'dirección']),
              codigoPostal: findCol(['c.p.', 'codigo postal', 'cp']),
              telefono: findCol(['celular', 'telefono', 'teléfono']),
              email: findCol(['mail', 'email']),
              cbu: findCol(['cbu']),
              numCuenta: findCol(['n° cuenta', 'nº cuenta', 'cuenta']),
              banco: findCol(['banco']),
              estadoCivil: findCol(['estado civil']),
              obraSocial: findCol(['obra social', 'cod obra'])
            };

            if (colMap.nombreCompleto === -1 || colMap.dni === -1) {
              mostrarToast('No se encontraron columnas "Nombre y Apellido" y/o "DNI".', 'error');
              return;
            }

            const registros = [];
            for (let i = headerRowIndex + 1; i < allRows.length; i++) {
              const row = allRows[i];
              const nombreCompleto = row[colMap.nombreCompleto] || '';
              const dni = String(row[colMap.dni] || '').replace(/\D/g, '');
              if (!nombreCompleto || !dni) continue;
              let apellido = '',
                nombre = '';
              const partes = nombreCompleto.split(',').map(s => s.trim());
              if (partes.length === 2) { apellido = partes[0];
                nombre = partes[1]; } else { nombre = nombreCompleto; }

              const getVal = (idx) => (idx !== -1) ? String(row[idx] || '').trim() : '';

              const registro = {
                datosPersonales: {
                  nombre,
                  apellido,
                  dni,
                  fechaNac: formatearFecha(getVal(colMap.fechaNac)),
                  domicilio: getVal(colMap.domicilio),
                  codigoPostal: getVal(colMap.codigoPostal),
                  telefono: getVal(colMap.telefono),
                  email: getVal(colMap.email),
                  estadoCivil: getVal(colMap.estadoCivil),
                  nombreMadre: getVal(colMap.nombreMadre),
                  nombrePadre: getVal(colMap.nombrePadre),
                  foto: ''
                },
                habilitaciones: { tipo: '', numero: '', fechaVenc: '', organismo: '' },
                datosLaborales: {
                  legajo: getVal(colMap.legajo),
                  fechaIngreso: formatearFecha(getVal(colMap.fechaIngreso)),
                  categoria: '',
                  horario: '',
                  obraSocial: getVal(colMap.obraSocial),
                  sindicato: '',
                  cuil: getVal(colMap.cuil),
                  banco: getVal(colMap.banco),
                  numCuenta: getVal(colMap.numCuenta),
                  cbu: getVal(colMap.cbu)
                },
                ropa: { tallaCamisa: '', tallaPantalon: '', tallaCalzado: '', entregas: [] },
                rrhh: { observaciones: '', evaluaciones: [] },
                disciplina: []
              };
              registros.push(registro);
            }

            if (registros.length === 0) {
              mostrarToast('No se encontraron datos válidos.', 'error');
              return;
            }

            window.datosImportadosAltas = registros;
            mostrarResumenAltas(registros);
            btnConfirmarImportarAltas.style.display = 'inline-block';
            btnConfirmarImportarAltas.disabled = false;

          } catch (err) {
            console.error('Error procesando Excel:', err);
            mostrarToast('Error al procesar el archivo: ' + err.message, 'error');
          }
        };
        reader.readAsArrayBuffer(file);
      }

      function mostrarResumenAltas(registros) {
        importResumenAltas.style.display = 'flex';
        importResumenAltas.innerHTML = `
                <span>📄 Registros encontrados: <strong class="count">${registros.length}</strong></span>
                <span>✅ Válidos: <strong class="count">${registros.length}</strong></span>
            `;
        let html = `<table><thead><tr><th>#</th><th>Apellido</th><th>Nombre</th><th>DNI</th><th>CUIL</th><th>F.Nac.</th><th>F.Ing.</th><th>Legajo</th><th>O.Social</th><th>Banco</th></tr></thead><tbody>`;
        registros.slice(0, 5).forEach((r, i) => {
          html += `<tr><td>${i+1}</td><td>${escapeHtml(r.datosPersonales.apellido)}</td><td>${escapeHtml(r.datosPersonales.nombre)}</td>
                    <td>${escapeHtml(formatearDNI(r.datosPersonales.dni))}</td><td>${escapeHtml(r.datosLaborales.cuil)}</td>
                    <td>${escapeHtml(r.datosPersonales.fechaNac)}</td><td>${escapeHtml(r.datosLaborales.fechaIngreso)}</td>
                    <td>${escapeHtml(r.datosLaborales.legajo)}</td><td>${escapeHtml(r.datosLaborales.obraSocial)}</td>
                    <td>${escapeHtml(r.datosLaborales.banco)}</td></tr>`;
        });
        html += `</tbody></table>`;
        if (registros.length > 5) html += `<div style="text-align:center;padding:0.5rem;">... y ${registros.length-5} más</div>`;
        importPreviewAltas.innerHTML = html;
      }

      async function confirmarImportacionAltas() {
        const registros = window.datosImportadosAltas;
        if (!registros || registros.length === 0) {
          mostrarToast('No hay datos para importar.', 'error');
          return;
        }

        btnConfirmarImportarAltas.disabled = true;
        btnConfirmarImportarAltas.textContent = 'Importando...';
        mostrarSpinnerGlobal(true);

        let importados = 0,
          errores = 0;
        try {
          for (const vig of registros) {
            try {
              const existente = await buscarPorDNI(vig.datosPersonales.dni);
              if (existente) { errores++; continue; }
              await agregarVigilante(vig);
              importados++;
            } catch (err) {
              console.error('Error guardando DNI ' + vig.datosPersonales.dni + ':', err);
              errores++;
            }
          }
          mostrarToast(`Importación completada: ${importados} agregados, ${errores} errores.`, 'exito');
          cerrarModalImportarAltas();
          await cargarDatos();
        } catch (err) {
          console.error('Error en importación:', err);
          mostrarToast('Error en la importación: ' + err.message, 'error');
        } finally {
          btnConfirmarImportarAltas.disabled = false;
          btnConfirmarImportarAltas.textContent = 'Confirmar importación';
          mostrarSpinnerGlobal(false);

      // ---------- IMPORTACIÓN DE SUSPENSIONES ----------
      function abrirModalImportarSuspensiones() {
        modalImportarSuspensionesOverlay.classList.add('visible');
        document.body.style.overflow = 'hidden';
        fileInputSuspensiones.value = '';
        btnProcesarSuspensiones.disabled = true;
        btnConfirmarImportarSuspensiones.style.display = 'none';
        importResumenSuspensiones.style.display = 'none';
        importPreviewSuspensiones.innerHTML = `<div class="sin-datos">Selecciona un archivo para previsualizar.</div>`;
        window.datosImportadosSuspensiones = null;
      }

      function cerrarModalImportarSuspensiones() {
        modalImportarSuspensionesOverlay.classList.remove('visible');
        document.body.style.overflow = 'auto';
      }

      function procesarArchivoSuspensiones(file) {
        const reader = new FileReader();
        reader.onload = async function(e) {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheetNames = workbook.SheetNames;
            if (sheetNames.length === 0) {
              mostrarToast('El archivo no contiene hojas.', 'error');
              return;
            }

            const vigilantes = await obtenerVigilantes();
            if (vigilantes.length === 0) {
              mostrarToast('No hay vigilantes cargados. Importa primero las altas.', 'error');
              return;
            }

            const resultados = [];
            let totalSanciones = 0;
            let noEncontrados = [];

            for (const sheetName of sheetNames) {
              const nombreHoja = sheetName.trim();
              let vigilanteEncontrado = null;
              const partesHoja = nombreHoja.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').split(' ');
              for (const vig of vigilantes) {
                const apellidoVig = vig.datosPersonales.apellido.toLowerCase().normalize('NFD').replace(
                  /[\u0300-\u036f]/g, '');
                const nombreVig = vig.datosPersonales.nombre.toLowerCase().normalize('NFD').replace(
                  /[\u0300-\u036f]/g, '');
                const nombreCompleto = apellidoVig + ' ' + nombreVig;
                const todasCoinciden = partesHoja.every(p => nombreCompleto.includes(p));
                if (todasCoinciden) { vigilanteEncontrado = vig; break; }
                if (partesHoja.length >= 2) {
                  const apellidoHoja = partesHoja[0];
                  const nombreHojaResto = partesHoja.slice(1).join(' ');
                  if (apellidoVig === apellidoHoja && nombreVig.includes(nombreHojaResto)) { vigilanteEncontrado =
                      vig; break; }
                }
              }
              if (!vigilanteEncontrado) { noEncontrados.push(nombreHoja); continue; }

              const worksheet = workbook.Sheets[sheetName];
              const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
              let headerRowIndex = -1;
              for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                const rowText = row.join(' ').toLowerCase();
                if (rowText.includes('fecha') && rowText.includes('motivo')) {
                  headerRowIndex = i;
                  break;
                }
              }
              if (headerRowIndex === -1) {
                console.warn('No se encontraron encabezados en hoja:', sheetName);
                continue;
              }

              const headers = rows[headerRowIndex];
              function findColIndex(keywords) {
                for (let i = 0; i < headers.length; i++) {
                  const h = String(headers[i]).toLowerCase().trim();
                  for (const kw of keywords) {
                    if (h.includes(kw.toLowerCase())) return i;
                  }
                }
                return -1;
              }
              const colFecha = findColIndex(['fecha']);
              const colDias = findColIndex(['dias', 'apercibimiento', 'cantidad']);
              const colServicio = findColIndex(['servicio']);
              const colMotivo = findColIndex(['motivo']);

              if (colFecha === -1 || colMotivo === -1) {
                console.warn('Columnas FECHA o MOTIVO no encontradas en hoja:', sheetName);
                continue;
              }

              const sanciones = [];
              for (let i = headerRowIndex + 1; i < rows.length; i++) {
                const row = rows[i];
                const fecha = row[colFecha] ? formatearFecha(row[colFecha]) : '';
                const dias = colDias !== -1 ? String(row[colDias] || '').trim() : '';
                const servicio = colServicio !== -1 ? String(row[colServicio] || '').trim() : '';
                const motivo = row[colMotivo] ? String(row[colMotivo]).trim() : '';
                if (fecha && motivo) {
                  sanciones.push({ fecha, dias, servicio, motivo });
                }
              }

              if (sanciones.length > 0) {
                resultados.push({ vigilante: vigilanteEncontrado, sanciones });
                totalSanciones += sanciones.length;
              }
            }

            if (resultados.length === 0 && noEncontrados.length === sheetNames.length) {
              mostrarToast('No se pudo asignar ninguna sanción. Verifica nombres de hojas.', 'error');
              return;
            }

            window.datosImportadosSuspensiones = resultados;

            importResumenSuspensiones.style.display = 'flex';
            let resumenHtml =
              `<span>📄 Sanciones encontradas: <strong class="count">${totalSanciones}</strong></span>`;
            resumenHtml +=
              `<span>👤 Vigilantes afectados: <strong class="count">${resultados.length}</strong></span>`;
            if (noEncontrados.length > 0) {
              resumenHtml +=
                `<span style="color:#b91c1c;">⚠️ No encontrados: ${noEncontrados.join(', ')}</span>`;
            }
            importResumenSuspensiones.innerHTML = resumenHtml;

            let previewHtml =
              `<table><thead><tr><th>Vigilante</th><th>Cantidad</th><th>Ejemplo</th></tr></thead><tbody>`;
            resultados.slice(0, 5).forEach(r => {
              const nombre = `${r.vigilante.datosPersonales.apellido}, ${r.vigilante.datosPersonales.nombre}`;
              const ejemplo = r.sanciones.length > 0 ?
                `${r.sanciones[0].fecha} - ${r.sanciones[0].motivo.substring(0, 30)}...` : '';
              previewHtml += `<tr><td>${escapeHtml(nombre)}</td><td>${r.sanciones.length}</td><td>${escapeHtml(ejemplo)}</td></tr>`;
            });
            previewHtml += `</tbody></table>`;
            if (resultados.length > 5) previewHtml += `<div style="text-align:center;padding:0.5rem;">... y ${resultados.length-5} más</div>`;
            importPreviewSuspensiones.innerHTML = previewHtml;

            btnConfirmarImportarSuspensiones.style.display = 'inline-block';
            btnConfirmarImportarSuspensiones.disabled = false;

          } catch (err) {
            console.error('Error procesando suspensiones:', err);
            mostrarToast('Error al procesar suspensiones: ' + err.message, 'error');
          }
        };
        reader.readAsArrayBuffer(file);
      }

      async function confirmarImportacionSuspensiones() {
        const resultados = window.datosImportadosSuspensiones;
        if (!resultados || resultados.length === 0) {
          mostrarToast('No hay datos para importar.', 'error');
          return;
        }

        btnConfirmarImportarSuspensiones.disabled = true;
        btnConfirmarImportarSuspensiones.textContent = 'Importando...';
        mostrarSpinnerGlobal(true);

        let totalAgregadas = 0;
        try {
          for (const item of resultados) {
            try {
              const vig = item.vigilante;
              if (!vig.disciplina) vig.disciplina = [];
              for (const s of item.sanciones) {
                const yaExiste = vig.disciplina.some(ex => ex.fecha === s.fecha && ex.motivo === s.motivo);
                if (!yaExiste) {
                  vig.disciplina.push(s);
                }
              }
              await actualizarVigilante(vig);
              totalAgregadas += item.sanciones.length;
            } catch (err) {
              console.error('Error al guardar sanciones:', err);
            }
          }
          mostrarToast(`Importación completada: ${totalAgregadas} sanciones agregadas.`, 'exito');
          cerrarModalImportarSuspensiones();
          await cargarDatos();
        } catch (err) {
          console.error('Error en importación de suspensiones:', err);
          mostrarToast('Error: ' + err.message, 'error');
        } finally {
          btnConfirmarImportarSuspensiones.disabled = false;
          btnConfirmarImportarSuspensiones.textContent = 'Confirmar importación';
          mostrarSpinnerGlobal(false);
        }
      }

      // ---------- AUTENTICACIÓN ----------
      function mostrarLogin() {
        loginContainer.style.display = 'flex';
        appContainer.style.display = 'none';
        loginForm.style.display = 'block';
        registroForm.style.display = 'none';
        loginError.style.display = 'none';
        registroError.style.display = 'none';
      }

      function mostrarApp() {
        loginContainer.style.display = 'none';
        appContainer.style.display = 'block';
        cargarDatos(); // Ahora cargarDatos está definida
      }

      // Manejar Login
      loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = loginEmail.value;
        const password = loginPassword.value;
        loginError.style.display = 'none';

        try {
          await auth.signInWithEmailAndPassword(email, password);
          mostrarApp();
        } catch (error) {
          console.error('Error de login:', error);
          loginError.textContent = error.message;
          loginError.style.display = 'block';
        }
      });

      // Manejar Registro
      registroForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = registroEmail.value;
        const password = registroPassword.value;
        const confirm = registroPasswordConfirm.value;
        registroError.style.display = 'none';

        if (password !== confirm) {
          registroError.textContent = 'Las contraseñas no coinciden.';
          registroError.style.display = 'block';
          return;
        }

        try {
          await auth.createUserWithEmailAndPassword(email, password);
          mostrarApp();
        } catch (error) {
          console.error('Error de registro:', error);
          registroError.textContent = error.message;
          registroError.style.display = 'block';
        }
      });

      // Manejar Cerrar Sesión
      btnCerrarSesion.addEventListener('click', async function() {
        try {
          await auth.signOut();
          mostrarLogin();
        } catch (error) {
          console.error('Error al cerrar sesión:', error);
          mostrarToast('Error al cerrar sesión: ' + error.message, 'error');
        }
      });

      // Cambiar entre login y registro
      btnRegistro.addEventListener('click', function() {
        loginForm.style.display = 'none';
        registroForm.style.display = 'block';
        loginError.style.display = 'none';
        registroError.style.display = 'none';
      });

      btnVolverLogin.addEventListener('click', function() {
        loginForm.style.display = 'block';
        registroForm.style.display = 'none';
        loginError.style.display = 'none';
        registroError.style.display = 'none';
      });

      // ---------- OBSERVADOR DE AUTENTICACIÓN ----------
      auth.onAuthStateChanged(function(user) {
        if (user) {
          // Usuario autenticado
          mostrarApp();
        } else {
          // Usuario no autenticado
          mostrarLogin();
        }
      });

      // ---------- INICIALIZACIÓN DE TABS Y EVENTOS ----------
      initTabs();

      // Eventos de los botones (se asignan aquí para que existan cuando se cargue la app)
      btnAgregar.addEventListener('click', abrirModalNuevo);
      btnImportar.addEventListener('click', abrirModalImportarAltas);
      btnImportarSuspensiones.addEventListener('click', abrirModalImportarSuspensiones);
      btnCerrarModal.addEventListener('click', cerrarModal);
      btnCancelarModal.addEventListener('click', cerrarModal);
      btnGuardarModal.addEventListener('click', guardarVigilante);
      modalOverlay.addEventListener('click', function(e) {
        if (e.target === this) cerrarModal();
      });

      // Altas
      btnCerrarImportar.addEventListener('click', cerrarModalImportarAltas);
      btnCancelarImportarAltas.addEventListener('click', cerrarModalImportarAltas);
      modalImportarOverlay.addEventListener('click', function(e) {
        if (e.target === this) cerrarModalImportarAltas();
      });
      fileInputAltas.addEventListener('change', function() {
        btnProcesarAltas.disabled = !this.files || this.files.length === 0;
      });
      btnProcesarAltas.addEventListener('click', function() {
        if (!fileInputAltas.files || fileInputAltas.files.length === 0) return;
        procesarArchivoAltas(fileInputAltas.files[0]);
      });
      btnConfirmarImportarAltas.addEventListener('click', confirmarImportacionAltas);

      // Suspensiones
      btnCerrarImportarSuspensiones.addEventListener('click', cerrarModalImportarSuspensiones);
      btnCancelarImportarSuspensiones.addEventListener('click', cerrarModalImportarSuspensiones);
      modalImportarSuspensionesOverlay.addEventListener('click', function(e) {
        if (e.target === this) cerrarModalImportarSuspensiones();
      });
      fileInputSuspensiones.addEventListener('change', function() {
        btnProcesarSuspensiones.disabled = !this.files || this.files.length === 0;
      });
      btnProcesarSuspensiones.addEventListener('click', function() {
        if (!fileInputSuspensiones.files || fileInputSuspensiones.files.length === 0) return;
        procesarArchivoSuspensiones(fileInputSuspensiones.files[0]);
      });
      btnConfirmarImportarSuspensiones.addEventListener('click', confirmarImportacionSuspensiones);

      listaVigilantes.addEventListener('click', manejarClicLista);

      btnAgregarEntrega.addEventListener('click', agregarEntrega);
      btnAgregarEvaluacion.addEventListener('click', agregarEvaluacion);
      inputEntregaTipo.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault();
          agregarEntrega(); }
      });
      inputEvalNota.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault();
          agregarEvaluacion(); }
      });

      btnAgregarSancion.addEventListener('click', agregarSancion);
      inputSanMotivo.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault();
          agregarSancion(); }
      });

      btnSeleccionarFoto.addEventListener('click', function() { inputFoto.click(); });
      inputFoto.addEventListener('change', manejarFoto);
      btnQuitarFoto.addEventListener('click', quitarFoto);

      buscadorInput.addEventListener('input', aplicarFiltros);
      btnLimpiarBusqueda.addEventListener('click', function() {
        buscadorInput.value = '';
        aplicarFiltros();
      });
      btnToggleFiltros.addEventListener('click', function() {
        panelFiltros.classList.toggle('visible');
        this.textContent = panelFiltros.classList.contains('visible') ? '✖ Ocultar filtros' :
          '⚙️ Filtros avanzados';
      });
      btnAplicarFiltros.addEventListener('click', aplicarFiltros);

      document.querySelectorAll('.panel-filtros input, .panel-filtros select').forEach(el => {
        el.addEventListener('change', aplicarFiltros);
        el.addEventListener('input', aplicarFiltros);
      });

      inputDNI.addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '');
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          if (modalOverlay.classList.contains('visible')) cerrarModal();
          if (modalImportarOverlay.classList.contains('visible')) cerrarModalImportarAltas();
          if (modalImportarSuspensionesOverlay.classList.contains('visible')) cerrarModalImportarSuspensiones();
        }
      });

      console.log('Aplicación con autenticación iniciada.');
    })();
  </script>
